name: Setup JS Community Development Environment

# This workflow pre-installs dependencies before Copilot coding agent starts working
# It ensures pnpm and project dependencies are available for building, testing, and linting

steps:
  - name: Initialize Git Submodules
    run: |
      git submodule update --init --recursive

  - name: Install pnpm
    run: |
      corepack enable
      corepack prepare pnpm@11.0.8 --activate
      pnpm --version

  - name: Install Project Dependencies
    run: |
      cd js-community
      pnpm install --frozen-lockfile

  - name: Verify Installation
    run: |
      cd js-community
      echo "Verifying pnpm installation..."
      pnpm --version
      echo "Checking project dependencies..."
      pnpm run --help >/dev/null
      echo "Setup complete!"
